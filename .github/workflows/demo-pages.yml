name: Demo no GitHub Pages

# Publica a demo estática (demo/) no GitHub Pages deste repositório:
# https://danzchohfi.github.io/Museuemfios
# O tema da loja (tema/) NÃO passa por aqui — ele sobe pra Nuvemshop
# via CLI/LCI (ver tema/README.md).

on:
  push:
    branches:
      - claude/museo-em-fios-template-cisenx
      - main
    paths:
      - "demo/**"
      - ".github/workflows/demo-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages (habilita na primeira execução)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload demo as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
